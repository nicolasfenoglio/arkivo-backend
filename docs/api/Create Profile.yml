info:
  name: Create Profile
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/profiles"
  headers:
    - name: Authorization
      value: Bearer {{AccessToken}}
  body:
    type: json
    data: |-
      {
        "firstName": "Nombre",
        "lastName": "Apellido"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
