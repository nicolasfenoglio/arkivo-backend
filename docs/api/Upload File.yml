info:
  name: Upload File
  type: http
  seq: 8

http:
  method: PUT
  url: "{{UploadLink}}"
  headers:
    - name: Content-Type
      value: application/pdf
  body:
    type: file
    data:
      - filePath: /Users/user/Downloads/Fenoglio Nicolás - Curriculum Vitae.pdf
        contentType: application/pdf
        selected: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
